<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Inicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Inicio</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <h2>Programas FACPYA</h2>
    <p>Administra los alumnos, maestros y carreras de la facultad.</p>
  </div>

  <ion-list>
    <ion-item routerLink="/tabs/alumnos" detail="true">
      <ion-icon aria-hidden="true" name="people" slot="start"></ion-icon>
      <ion-label>Alumnos</ion-label>
    </ion-item>
    <ion-item routerLink="/tabs/maestros" detail="true">
      <ion-icon aria-hidden="true" name="person" slot="start"></ion-icon>
      <ion-label>Maestros</ion-label>
    </ion-item>
    <ion-item routerLink="/tabs/carreras" detail="true">
      <ion-icon aria-hidden="true" name="school" slot="start"></ion-icon>
      <ion-label>Carreras</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
